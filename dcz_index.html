<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studijní plánovač</title>
    <link rel="stylesheet" href="dcz_style.css">
</head>

<body>

<div class="container">
    <h1>📚 Studijní plánovač</h1>

    <div class="input-area">
        <input type="text" id="taskInput" placeholder="Zadej nový úkol...">
        <button id="addBtn">Přidat</button>
    </div>

    <div class="progress">
        <div id="progressBar"></div>
    </div>

    <p id="progressText">0 % hotovo</p>

    <ul id="taskList"></ul>

    <button id="clearBtn">Odstranit splněné</button>
</div>

<script src="dcz_script.js"></script>

</body>
</html>

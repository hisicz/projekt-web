<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studijní plánovač</title>
  <link rel="stylesheet" href="dcz_style.css">
</head>
<body>
  <main class="container">
    <h1>📚 Studijní plánovač</h1>

    <div class="input-area">
      <input id="taskInput" type="text" placeholder="Zadej nový úkol...">
      <button id="addBtn" type="button">Přidat</button>
    </div>

    <div class="progress"><div id="progressBar"></div></div>
    <p id="progressText">0 % hotovo</p>
    <ul id="taskList"></ul>
    <button id="clearBtn" type="button">Odstranit splněné</button>
  </main>

  <script src="dcz_script.js"></script>
</body>
</html>

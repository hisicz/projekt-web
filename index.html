<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Test Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="#">✓ Student<span>Plan</span></a>
    <div>
      <button id="theme" aria-label="Přepnout režim">☾</button>
      <button class="primary" id="add">+ Přidat test</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <small>STUDIJNÍ PŘEHLED</small>
        <h1>Ahoj, studente! <em>Co tě čeká?</em></h1>
        <p id="welcome"></p>
      </div>
      <b aria-hidden="true">✦</b>
    </section>

    <section class="stats" aria-label="Rychlý přehled">
      <article>▣ <div><strong id="all">0</strong><span>všechny testy</span></div></article>
      <article>◷ <div><strong id="week">0</strong><span>tento týden</span></div></article>
      <article>✓ <div><strong id="progress">0 %</strong><span>témat splněno</span></div></article>
    </section>

    <section>
      <div class="heading">
        <div><small>MŮJ PLÁN</small><h2>Nadcházející testy</h2></div>
        <button id="clear">Zrušit filtry</button>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="⌕ Hledat předmět...">
        <select id="priority"><option value="all">Všechny priority</option><option value="high">Vysoká priorita</option><option value="medium">Střední priorita</option><option value="low">Nízká priorita</option></select>
        <select id="status"><option value="all">Všechny stavy</option><option value="open">K učení</option><option value="done">Hotovo</option></select>
      </div>
      <div id="list"></div>
      <div class="empty" id="empty"><b>✎</b><h3>Zatím tu nic není</h3><p>Přidej první test a vytvoř si klidnější plán.</p><button class="primary" id="emptyAdd">＋ Přidat test</button></div>
    </section>
  </main>

  <!-- Formulář pro vytvoření nebo úpravu testu. -->
  <dialog id="modal">
    <form id="form">
      <div class="modalHead"><div><small>NOVÝ ZÁZNAM</small><h2 id="modalTitle">Přidat test</h2></div><button type="button" class="close">×</button></div>
      <input id="id" type="hidden">
      <div class="grid">
        <label>Předmět<input id="subject" required placeholder="Např. Matematika"></label>
        <label>Datum a čas<input id="date" type="datetime-local" required></label>
        <label>Obtížnost<select id="difficulty"><option value="high">Vysoká</option><option value="medium">Střední</option><option value="low">Nízká</option></select></label>
        <label class="wide">Poznámka<textarea id="note" placeholder="Na co se zaměřit?"></textarea></label>
      </div>
      <div class="topicBox"><b>Témata k naučení</b><small>Enter pro přidání</small><div id="chips"></div><input id="topic" placeholder="Např. Derivace funkcí"></div>
      <div class="actions"><button type="button" class="close">Zrušit</button><button class="primary">Uložit test</button></div>
    </form>
  </dialog>

  <!-- Šablona jedné karty testu, kterou JavaScript naplní daty. -->
  <template id="card"><article class="card"><div class="date"><b></b><small></small></div><div><div class="cardHead"><div><i></i><h3></h3></div><div><button class="edit">✎</button><button class="delete">×</button></div></div><p class="count"></p><p class="note"></p><div class="prog"><span>Témata k naučení</span><b></b></div><div class="bar"><i></i></div><div class="topics"></div></div></article></template>
  <script src="script.js"></script>
</body>
</html>
